      "canonical_meme": "use split_logic\ndefine argc: Int as argument count\nif argc < 2:\n    print error \"Error: unknown command. Usage: split <add-person|add-expense|pay|balances|settle|ledger> ...\"\n    exit with code 1\ndefine cmd: String as argument 1\ndefine list people as empty List<Person>\ndefine loaded_people: Optional<List<Person>> as read json records Person from file \"data/people.json\" or else nothing\nif loaded_people is not nothing:\n    set people to value of loaded_people\ndefine list expenses as empty List<Expense>\ndefine loaded_expense_rows: Optional<List<ExpenseRow>> as read json records ExpenseRow from file \"data/expenses.json\" or else nothing\nif loaded_expense_rows is not nothing:\n    for each row in value of loaded_expense_rows:\n        define exp: Expense as from_row(row)\n        append exp to expenses\ndefine list payments as empty List<Payment>\ndefine loaded_payments: Optional<List<Payment>> as read json records Payment from file \"data/payments.json\" or else nothing\nif loaded_payments is not nothing:\n    set payments to value of loaded_payments\nmatch cmd:\n    when \"add-person\":\n        if argc != 3:\n            print error \"Error: usage: split add-person <name>\"\n            exit with code 1\n        define name: String as argument 2\n        if person_known(people, name):\n            print error \"Error: person already exists: \" + name\n            exit with code 1\n        define p: Person as Person(name=name)\n        append p to people\n        create directory \"data\"\n        write people as json to file \"data/people.json\"\n        print \"Added person \" + name\n    when \"add-expense\":\n        if argc < 4:\n            print error \"Error: usage: split add-expense <payer> <total-cents> <name1> <name2> ... [exact <c1> <c2> ... | shares <w1> <w2> ...]\"\n            exit with code 1\n        define payer: String as argument 2\n        define total: Int as parse_positive_cents(argument 3)\n        if total < 0:\n            print error \"Error: invalid total-cents (must be a positive integer): \" + argument 3\n            exit with code 1\n        if not person_known(people, payer):\n            print error \"Error: unknown person: \" + payer\n            exit with code 1\n        define mode: String as \"equal\"\n        define split_at: Int as argc\n        define keyword_found: Bool as false\n        define i: Int as 4\n        while i <= argc - 1:\n            define a: String as argument i\n            if a == \"equal\" or a == \"exact\" or a == \"shares\":\n                if keyword_found:\n                    print error \"Error: duplicate split-mode keyword\"\n                    exit with code 1\n                set keyword_found to true\n                set mode to a\n                set split_at to i\n            add 1 to i\n        define list names as empty List<String>\n        define j: Int as 4\n        while j <= split_at - 1:\n            define nm: String as argument j\n            append nm to names\n            add 1 to j\n        if length of names == 0:\n            print error \"Error: at least one participant is required\"\n            exit with code 1\n        if has_duplicate(names):\n            print error \"Error: duplicate participant name\"\n            exit with code 1\n        for each participant in names:\n            if not person_known(people, participant):\n                print error \"Error: unknown person: \" + participant\n                exit with code 1\n        define list nums as empty List<Int>\n        if split_at < argc:\n            define k: Int as split_at + 1\n            while k <= argc - 1:\n                define v: Int as integer value of (argument k) or else -1\n                if v < 0:\n                    print error \"Error: invalid number: \" + argument k\n                    exit with code 1\n                append v to nums\n                add 1 to k\n        if mode == \"equal\":\n            if length of nums > 0:\n                print error \"Error: equal mode takes no extra arguments\"\n                exit with code 1\n        if mode == \"exact\":\n            if length of nums != length of names:\n                print error \"Error: exact mode needs one amount per participant\"\n                exit with code 1\n            for each c in nums:\n                if c < 0:\n                    print error \"Error: exact amounts must be non-negative\"\n                    exit with code 1\n            if not exact_sums_ok(nums, total):\n                print error \"Error: exact amounts must sum to the total\"\n                exit with code 1\n        if mode == \"shares\":\n            if length of nums != length of names:\n                print error \"Error: shares mode needs one weight per participant\"\n                exit with code 1\n            if not parts_positive(nums):\n                print error \"Error: share weights must be positive integers\"\n                exit with code 1\n        define eid: Int as next_entry_id(expenses, payments)\n        define exp: Expense as Expense(id=eid, payer=payer, total=total, mode=mode, participants=names, exact=nums, shares=nums)\n        append exp to expenses\n        create directory \"data\"\n        define list rows as empty List<ExpenseRow>\n        for each e in expenses:\n            define row: ExpenseRow as to_row(e)\n            append row to rows\n        write rows as json to file \"data/expenses.json\"\n        print \"Added expense \" + text of eid + \": \" + payer + \" paid \" + money(total) + \" for \" + join names with \", \" + \" (\" + mode + \")\"\n    when \"pay\":\n        if argc != 5:\n            print error \"Error: usage: split pay <from> <to> <cents>\"\n            exit with code 1\n        define from_p: String as argument 2\n        define to_p: String as argument 3\n        define cents: Int as integer value of (argument 4) or else -1\n        if cents <= 0:\n            print error \"Error: payment cents must be a positive integer: \" + argument 4\n            exit with code 1\n        if not person_known(people, from_p):\n            print error \"Error: unknown person: \" + from_p\n            exit with code 1\n        if not person_known(people, to_p):\n            print error \"Error: unknown person: \" + to_p\n            exit with code 1\n        if from_p == to_p:\n            print error \"Error: from and to must be different people\"\n            exit with code 1\n        define pid: Int as next_entry_id(expenses, payments)\n        define pay: Payment as Payment(id=pid, from_p=from_p, to_p=to_p, cents=cents)\n        append pay to payments\n        create directory \"data\"\n        write payments as json to file \"data/payments.json\"\n        print \"Added payment \" + text of pid + \": \" + from_p + \" paid \" + to_p + \" \" + money(cents)\n    when \"balances\":\n        define net: Map<String, Int> as compute_balances(expenses, payments)\n        for each line in balance_lines(net):\n            print line\n    when \"settle\":\n        define net: Map<String, Int> as compute_balances(expenses, payments)\n        define list transfers as settle_transfers(net)\n        if length of transfers == 0:\n            print \"All balances are settled.\"\n        else:\n            for each line in settle_lines(net):\n                print line\n            define n_t: Int as length of transfers\n            print \"Settled with \" + text of n_t + \" transfers.\"\n            define replay: Map<String, Int> as apply_transfers(net, transfers)\n            assert all_balances_zero(replay)\n            print \"Replay proof: all balances are zero.\"\n    when \"ledger\":\n        define list lines as ledger_lines(expenses, payments)\n        if length of lines == 0:\n            print \"Ledger is empty.\"\n        else:\n            for each line in lines:\n                print line\n    otherwise:\n        print error \"Error: unknown command '\" + cmd + \"'. Usage: split <add-person|add-expense|pay|balances|settle|ledger> ...\"\n        exit with code 1",
