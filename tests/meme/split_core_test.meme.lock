      "canonical_meme": "use split_logic\ntest money_formatting:\n    define list no_ints as empty List<Int>\n    assert money(1250) == \"12.50\"\n    assert money(-1250) == \"-12.50\"\n    assert money(5) == \"0.05\"\n    assert money(-5) == \"-0.05\"\n    assert money(0) == \"0.00\"\n    assert money(100) == \"1.00\"\n    assert money(100000) == \"1000.00\"\ntest equal_split_exact_division:\n    define list no_ints as empty List<Int>\n    define list amounts as split_equal(100, [\"alice\", \"bob\"])\n    assert amounts[0] == 50\n    assert amounts[1] == 50\ntest equal_split_remainder_name_order:\n    define list no_ints as empty List<Int>\n    define list amounts as split_equal(100, [\"carol\", \"alice\", \"bob\"])\n    assert amounts[0] == 33\n    assert amounts[1] == 34\n    assert amounts[2] == 33\ntest equal_split_two_leftover_cents:\n    define list no_ints as empty List<Int>\n    define list amounts as split_equal(101, [\"carol\", \"alice\", \"bob\"])\n    assert amounts[0] == 33\n    assert amounts[1] == 34\n    assert amounts[2] == 34\ntest exact_mode_owed:\n    define list no_ints as empty List<Int>\n    define exp: Expense as Expense(id=1, payer=\"alice\", total=100, mode=\"exact\", participants=[\"bob\", \"carol\"], exact=[30, 70], shares=no_ints)\n    define list owed as compute_owed(exp)\n    assert owed[0] == 30\n    assert owed[1] == 70\ntest exact_mode_rejects_mismatch:\n    define list no_ints as empty List<Int>\n    assert exact_sums_ok([30, 70], 100) == true\n    assert not exact_sums_ok([30, 71], 100)\n    assert not (exact_sums_ok([100], 100) == false)\n    assert exact_sums_ok(no_ints, 0) == true\ntest shares_mode_proportional:\n    define list no_ints as empty List<Int>\n    define list amounts as split_shares(100, [\"alice\", \"bob\", \"carol\"], [1, 1, 2])\n    assert amounts[0] == 25\n    assert amounts[1] == 25\n    assert amounts[2] == 50\ntest shares_mode_remainder_name_order:\n    define list no_ints as empty List<Int>\n    define list amounts as split_shares(101, [\"carol\", \"alice\", \"bob\"], [1, 1, 1])\n    assert amounts[0] == 33\n    assert amounts[1] == 34\n    assert amounts[2] == 34\ntest compute_owed_dispatches_by_mode:\n    define list no_ints as empty List<Int>\n    define eq: Expense as Expense(id=1, payer=\"p\", total=90, mode=\"equal\", participants=[\"a\", \"b\", \"c\"], exact=no_ints, shares=no_ints)\n    define list owed_eq as compute_owed(eq)\n    assert owed_eq[0] == 30\n    assert owed_eq[1] == 30\n    assert owed_eq[2] == 30\ntest validation_helpers:\n    define list no_ints as empty List<Int>\n    define list folks as [Person(name=\"alice\"), Person(name=\"bob\")]\n    assert person_known(folks, \"alice\") == true\n    assert not person_known(folks, \"carol\")\n    assert has_duplicate([\"a\", \"b\", \"a\"])\n    assert not has_duplicate([\"a\", \"b\", \"c\"])\n    assert not parts_positive([1, 0, 2])\n    assert parts_positive([1, 2, 3]) == true\ntest entry_id_counter_shared:\n    define list no_ints as empty List<Int>\n    define list es as empty List<Expense>\n    define list ps as empty List<Payment>\n    assert next_entry_id(es, ps) == 1\n    define e1: Expense as Expense(id=3, payer=\"p\", total=100, mode=\"equal\", participants=[\"p\"], exact=no_ints, shares=no_ints)\n    append e1 to es\n    assert next_entry_id(es, ps) == 4\n    define p1: Payment as Payment(id=7, from_p=\"a\", to_p=\"b\", cents=10)\n    append p1 to ps\n    assert next_entry_id(es, ps) == 8",
