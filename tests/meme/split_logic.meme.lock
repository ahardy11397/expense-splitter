      "canonical_meme": "record Person:\n    name: String\nrecord Expense:\n    id: Int\n    payer: String\n    total: Int\n    mode: String\n    participants: List<String>\n    exact: List<Int>\n    shares: List<Int>\nrecord Payment:\n    id: Int\n    from_p: String\n    to_p: String\n    cents: Int\nrecord Transfer:\n    from_p: String\n    to_p: String\n    cents: Int\nrecord ExpenseRow:\n    id: Int\n    payer: String\n    total: Int\n    mode: String\n    participants: String\n    exact: String\n    shares: String\nfunction join_ints(parts: List<Int>) -> String:\n    define out: String as \"\"\n    for each index i item c in parts:\n        if i > 0:\n            set out to out + \",\"\n        set out to out + text of c\n    return out\nfunction split_ints(text: String) -> List<Int>:\n    define list out as empty List<Int>\n    if length of string text == 0:\n        return out\n    define list parts as split text by \",\"\n    for each p in parts:\n        append integer value of p to out\n    return out\nfunction to_row(e: Expense) -> ExpenseRow:\n    define list participants as e.participants\n    define ps: String as join participants with \",\"\n    return ExpenseRow(id=e.id, payer=e.payer, total=e.total, mode=e.mode, participants=ps, exact=join_ints(e.exact), shares=join_ints(e.shares))\nfunction from_row(r: ExpenseRow) -> Expense:\n    define list ps as split r.participants by \",\"\n    return Expense(id=r.id, payer=r.payer, total=r.total, mode=r.mode, participants=ps, exact=split_ints(r.exact), shares=split_ints(r.shares))\nfunction money(cents: Int) -> String:\n    define neg: Bool as cents < 0\n    define abs_c: Int as cents\n    if neg:\n        set abs_c to -cents\n    define d: Int as abs_c / 100\n    define rem: Int as abs_c % 100\n    define rem_s: String as text of rem\n    if rem < 10:\n        set rem_s to \"0\" + rem_s\n    define out: String as text of d + \".\" + rem_s\n    if neg:\n        set out to \"-\" + out\n    return out\nfunction split_equal(total: Int, participants: List<String>) -> List<Int>:\n    define n: Int as length of participants\n    define base: Int as total / n\n    define rem: Int as total % n\n    define list sorted_names as participants\n    sort sorted_names ascending\n    define list amounts as empty List<Int>\n    for each name in participants:\n        define bonus: Int as 0\n        for each index i item sname in sorted_names:\n            if i < rem and sname == name:\n                set bonus to 1\n        define owed: Int as base + bonus\n        append owed to amounts\n    return amounts\nfunction split_shares(total: Int, participants: List<String>, weights: List<Int>) -> List<Int>:\n    define sumw: Int as 0\n    for each w in weights:\n        add w to sumw\n    define list amounts as empty List<Int>\n    define assigned: Int as 0\n    for each index i item name in participants:\n        define base: Int as total * weights[i] / sumw\n        append base to amounts\n        add base to assigned\n    define rem: Int as total - assigned\n    define list sorted_names as participants\n    sort sorted_names ascending\n    for each index i item sname in sorted_names:\n        if i < rem:\n            for each index j item name in participants:\n                if name == sname:\n                    define cur: Int as amounts[j]\n                    set amounts[j] to cur + 1\n    return amounts\nfunction compute_owed(exp: Expense) -> List<Int>:\n    if exp.mode == \"exact\":\n        return exp.exact\n    if exp.mode == \"shares\":\n        return split_shares(exp.total, exp.participants, exp.shares)\n    return split_equal(exp.total, exp.participants)\nfunction compute_balances(expenses: List<Expense>, payments: List<Payment>) -> Map<String, Int>:\n    define net: Map<String, Int> as empty Map<String, Int>\n    for each exp in expenses:\n        define pc: Int as net[exp.payer] default 0\n        set net[exp.payer] to pc + exp.total\n        define list owed as compute_owed(exp)\n        define list participants as exp.participants\n        for each index i item name in participants:\n            define nc: Int as net[name] default 0\n            set net[name] to nc - owed[i]\n    for each p in payments:\n        define fc: Int as net[p.from_p] default 0\n        set net[p.from_p] to fc + p.cents\n        define tc: Int as net[p.to_p] default 0\n        set net[p.to_p] to tc - p.cents\n    return net\nfunction settle_transfers(net: Map<String, Int>) -> List<Transfer>:\n    define list transfers as empty List<Transfer>\n    define bal: Map<String, Int> as empty Map<String, Int>\n    define list names as empty List<String>\n    for each k in net:\n        append k to names\n        define v: Int as net[k] default 0\n        set bal[k] to v\n    while true:\n        define max_name: String as \"\"\n        define max_val: Int as 0\n        define min_name: String as \"\"\n        define min_val: Int as 0\n        for each name in names:\n            define v: Int as bal[name] default 0\n            if v > max_val:\n                set max_val to v\n                set max_name to name\n            if v < min_val:\n                set min_val to v\n                set min_name to name\n        if max_val == 0:\n            break\n        define amount: Int as max_val\n        if -min_val < max_val:\n            set amount to -min_val\n        define t: Transfer as Transfer(from_p=min_name, to_p=max_name, cents=amount)\n        append t to transfers\n        define mc: Int as bal[max_name] default 0\n        set bal[max_name] to mc - amount\n        define nc: Int as bal[min_name] default 0\n        set bal[min_name] to nc + amount\n    return transfers\nfunction apply_transfers(net: Map<String, Int>, transfers: List<Transfer>) -> Map<String, Int>:\n    define bal: Map<String, Int> as empty Map<String, Int>\n    for each k in net:\n        define v: Int as net[k] default 0\n        set bal[k] to v\n    for each t in transfers:\n        define fc: Int as bal[t.from_p] default 0\n        set bal[t.from_p] to fc + t.cents\n        define tc: Int as bal[t.to_p] default 0\n        set bal[t.to_p] to tc - t.cents\n    return bal\nfunction all_balances_zero(bal: Map<String, Int>) -> Bool:\n    for each k in bal:\n        define v: Int as bal[k] default 0\n        if v != 0:\n            return false\n    return true\nfunction person_known(people: List<Person>, name: String) -> Bool:\n    for each p in people:\n        if p.name == name:\n            return true\n    return false\nfunction exact_sums_ok(parts: List<Int>, total: Int) -> Bool:\n    define s: Int as 0\n    for each c in parts:\n        add c to s\n    return s == total\nfunction parts_positive(parts: List<Int>) -> Bool:\n    for each c in parts:\n        if c <= 0:\n            return false\n    return true\nfunction parse_positive_cents(text: String) -> Int:\n    define v: Int as integer value of text or else -1\n    if v <= 0:\n        return -1\n    return v\nfunction has_duplicate(names: List<String>) -> Bool:\n    define i: Int as 0\n    while i <= length of names - 1:\n        define k: Int as i + 1\n        while k <= length of names - 1:\n            if names[i] == names[k]:\n                return true\n            add 1 to k\n        add 1 to i\n    return false\nfunction next_entry_id(expenses: List<Expense>, payments: List<Payment>) -> Int:\n    define mx: Int as 0\n    for each e in expenses:\n        if e.id > mx:\n            set mx to e.id\n    for each p in payments:\n        if p.id > mx:\n            set mx to p.id\n    return mx + 1\nfunction expense_line(e: Expense) -> String:\n    define list owed as compute_owed(e)\n    define list participants as e.participants\n    define detail: String as \"\"\n    for each index i item name in participants:\n        if i > 0:\n            set detail to detail + \"; \"\n        define piece: String as name + \" owes \" + money(owed[i])\n        set detail to detail + piece\n    define line: String as text of e.id + \" | expense | \" + e.payer + \" paid \" + money(e.total) + \" | \" + e.mode + \" | \" + detail\n    return line\nfunction payment_line(p: Payment) -> String:\n    define line: String as text of p.id + \" | payment | \" + p.from_p + \" paid \" + p.to_p + \" \" + money(p.cents)\n    return line\nfunction ledger_lines(expenses: List<Expense>, payments: List<Payment>) -> List<String>:\n    define list lines as empty List<String>\n    define mx: Int as next_entry_id(expenses, payments) - 1\n    if mx >= 1:\n        for eid from 1 to mx:\n            for each e in expenses:\n                if e.id == eid:\n                    append expense_line(e) to lines\n            for each p in payments:\n                if p.id == eid:\n                    append payment_line(p) to lines\n    return lines\nfunction balance_lines(net: Map<String, Int>) -> List<String>:\n    define list lines as empty List<String>\n    for each name in net:\n        define c: Int as net[name] default 0\n        define line: String as name + \" \" + money(c)\n        append line to lines\n    return lines\nfunction settle_lines(net: Map<String, Int>) -> List<String>:\n    define list transfers as settle_transfers(net)\n    define list lines as empty List<String>\n    for each t in transfers:\n        define line: String as t.from_p + \" -> \" + t.to_p + \" \" + money(t.cents)\n        append line to lines\n    return lines",
