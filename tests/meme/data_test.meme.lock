ed is not nothing\n    define list back as value of loaded\n    assert length of back == 1\n    assert back[0].from_p == \"bob\"\n    assert back[0].cents == 500\n    delete file \"split_roundtrip_payments_1.json\"\ntest missing_file_tolerance:\n    define list no_ints as empty List<Int>\n    define loaded_e: Optional<List<ExpenseRow>> as read json records ExpenseRow from file \"split_missing_1.json\" or else nothing\n    assert loaded_e is nothing\n    define loaded_p: Optional<List<Person>> as read json records Person from file \"split_missing_1.json\" or else nothing\n    assert loaded_p is nothing\ntest corrupt_json_tolerance:\n    define list no_ints as empty List<Int>\n    write file \"split_corrupt_1.json\" with \"{this is not json\"\n    define loaded: Optional<List<ExpenseRow>> as read json records ExpenseRow from file \"split_corrupt_1.json\" or else nothing\n    assert loaded is nothing\n    delete file \"split_corrupt_1.json\"\ntest schema_mismatch_tolerance:\n    define list no_ints as empty List<Int>\n    write file \"split_schema_1.json\" with \"[1, 2, 3]\"\n    define loaded: Optional<List<ExpenseRow>> as read json records ExpenseRow from file \"split_schema_1.json\" or else nothing\n    assert loaded is nothing\n    delete file \"split_schema_1.json\"\ntest empty_csv_int_helpers:\n    define list no_ints as empty List<Int>\n    define list empty_ints as split_ints(\"\")\n    assert length of empty_ints == 0\n    define joined: String as join_ints(no_ints)\n    assert joined == \"\"\n    define list parsed as split_ints(\"12,0,340\")\n    assert parsed[0] == 12\n    assert parsed[1] == 0\n    assert parsed[2] == 340",
