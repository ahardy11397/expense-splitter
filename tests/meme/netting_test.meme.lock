      "canonical_meme": "use split_logic\ntest multi_expense_netting:\n    define list no_ints as empty List<Int>\n    define e1: Expense as Expense(id=1, payer=\"ann\", total=100, mode=\"equal\", participants=[\"ann\", \"bob\"], exact=no_ints, shares=no_ints)\n    define e2: Expense as Expense(id=2, payer=\"bob\", total=60, mode=\"equal\", participants=[\"ann\", \"bob\"], exact=no_ints, shares=no_ints)\n    define list es as [e1, e2]\n    define list ps as empty List<Payment>\n    define net: Map<String, Int> as compute_balances(es, ps)\n    define a: Int as net[\"ann\"] default 0\n    define b: Int as net[\"bob\"] default 0\n    assert a == 20\n    assert b == -20\ntest payments_offset_expenses:\n    define list no_ints as empty List<Int>\n    define e1: Expense as Expense(id=1, payer=\"ann\", total=100, mode=\"equal\", participants=[\"ann\", \"bob\"], exact=no_ints, shares=no_ints)\n    define list es as [e1]\n    define p1: Payment as Payment(id=2, from_p=\"bob\", to_p=\"ann\", cents=10)\n    define list ps as [p1]\n    define net: Map<String, Int> as compute_balances(es, ps)\n    define a: Int as net[\"ann\"] default 0\n    define b: Int as net[\"bob\"] default 0\n    assert a == 40\n    assert b == -40\ntest balances_sum_to_zero:\n    define list no_ints as empty List<Int>\n    define e1: Expense as Expense(id=1, payer=\"ann\", total=120, mode=\"exact\", participants=[\"ann\", \"bob\", \"cyd\"], exact=[60, 40, 20], shares=no_ints)\n    define e2: Expense as Expense(id=2, payer=\"bob\", total=101, mode=\"shares\", participants=[\"ann\", \"bob\", \"cyd\"], exact=no_ints, shares=[1, 1, 2])\n    define p1: Payment as Payment(id=3, from_p=\"cyd\", to_p=\"ann\", cents=7)\n    define list es as [e1, e2]\n    define list ps as [p1]\n    define net: Map<String, Int> as compute_balances(es, ps)\n    define total: Int as 0\n    for each k in net:\n        define v: Int as net[k] default 0\n        add v to total\n    assert total == 0\ntest balances_map_sorted_key_order:\n    define list no_ints as empty List<Int>\n    define e1: Expense as Expense(id=1, payer=\"zoe\", total=3000, mode=\"equal\", participants=[\"zoe\", \"amy\", \"mia\"], exact=no_ints, shares=no_ints)\n    define list es as [e1]\n    define list ps as empty List<Payment>\n    define net: Map<String, Int> as compute_balances(es, ps)\n    define list lines as balance_lines(net)\n    assert lines[0] == \"amy -10.00\"\n    assert lines[1] == \"mia -10.00\"\n    assert lines[2] == \"zoe 20.00\"",
